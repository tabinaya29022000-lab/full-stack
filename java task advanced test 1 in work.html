<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .heading {
            padding: 10px;
            font-size: 25px;
        }

        form {
            padding: 10px;
        }

        #resultcon {
            background-color: aqua;
            width: 300px;
            height: 400px;
            margin-left: 350px;
            margin-top: -270px;
        }
    </style>
</head>

<body>
    <h1 class="heading">Student Input</h1>

    <form action="">
        <label for="">Student Name : </label><br>
        <input type="text" name="Name" id="name" required><br>
        <label for="">Student ID : </label><br>
        <input type="text" name="id" id="id" maxlength="6"><br>
        <label for="">Email : </label><br>
        <input type="text" name="email" id="email"><br>
        <label for="">Department : </label><br>
        <input type="text" name="department" id="dep"><br>
        <label for="">Mark : </label><br>
        <input type="number" name="mark" id="mark"><br><br>
        
    </form>
    <button id="submit" onclick="result()">Submit</button>
    <div id="resultcon"></div>
    
    <script>
        function result() {
            var Name=document.getElementById("name").value;
            var ID=document.getElementById("id").value;
            var Email=document.getElementById("email").value;
            var Department=document.getElementById("dep").value;
            var mark=Number( document.getElementById("mark").value);

            var Result=document.getElementById("resultcon");

            let grade="";
            if (mark=0 && mark<50)
            {
                grade="F";
            }
            else if (mark>=50 && mark<60)
            {
                grade="D";
            }
            else if (mark>=60 && mark<70)
            {
                grade="C";
            }
            else if (mark>=70 && mark<80)
            {
                grade="B";
            }
            else if (mark>=80 && mark<90)
            {
                grade="A";
            }
            else if (mark>=90 && mark<=100)
            {
                grade="A+";
            }
            else 
            {
                grade="Invalid grade";
            }

            let result="";
            if (mark>=50)
            {
                result="pass";
            }
            else 
            {
                result="fail";
            }
            

            Result.innerHTML=`<pre> 
            Student Name  :  ${ Name.trim().charAt(0).toUpperCase() + Name.slice(1).toLowerCase() }     
            Student ID    :  ${ ID } 
            Email         :  ${ Email }
            Department    :  ${ Department }


            Mark          :  ${mark}

            Grade         :  ${grade}

            result        :  ${result}


            </pre>`;

            
            


        }
    </script>
</body>

</html>
