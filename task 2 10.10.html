    <div>
        <h1 class="heading"> <i class="fa-solid fa-graduation-cap"></i> Student Registration Form</h1>

    </div>
    <div class="con1">
        <h1 class="sub-head1"><i class="fa-solid fa-user"></i> 1.Personal Details</h1>
        <form action="">
            <div class="formcon1">
                <div class="form1">
                    <label for="">Full Name <span style="color: red;">*</span></label><br>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <div class="form1">
                    <label for="">Date of Birth <span style="color: red;">*</span></label><br>
                    <input type="number" placeholder="dd-mm-yyyy">
                </div>
                <div class="form1">
                    <label for="">Gender <span style="color: red;">*</span></label><br>
                    <div class="gendercon">
                        <input type="radio" name="gender" placeholder="Male">
                        <label for="">Male</label>
                        <input type="radio" name="gender" placeholder="Female">
                        <label for="">Female</label>
                        <input type="radio" name="gender" placeholder="Other">
                        <label for="">Other</label>
                    </div>
                </div>
                <div class="form1">
                    <label for="">Father's Name <span style="color: red;">*</span></label><br>
                    <input type="text" placeholder="Enter father's name">
                </div>
                <div class="form1">
                    <label for="">Mother's Name <span style="color: red;">*</span></label><br>
                    <input type="text" placeholder="Enter mother's name">
                </div>
                <div class="form1">
                    <label for="">Blood Group</label><br>
                    <select name="Blood-group" id="">
                        <option value="" disabled selected>-- Select Blood Group --</option>
                        <option value="A+ve">A+ve</option>
                        <option value="A1+ve">A1+ve</option>
                        <option value="B+ve">B+ve</option>
                        <option value="o+ve">O+ve</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
            </div>
        </form>

    </div>
