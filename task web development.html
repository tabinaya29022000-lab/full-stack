<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body
        {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .main
        {
            background-color: rgb(239, 247, 247);
            width: 70%;
            border: 1px solid grey;
            margin: 50px auto ;
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
            border-radius: 20px;
        }
        .subcon1,.subcon2,.subcon3
        {
            background-color:rgb(214, 211, 211);
            flex: 1 0 270px;
            border-radius: 20px;
        }
        img{
            width:100%;
            height:auto;     
            border-radius: 20px;       
        }
        .subcon2,.subcon3
        {
            display: flex;
            justify-content: center;
            
            flex-direction: column;
        }
        h1{
            font-size: 18px;             
            padding: 10px; 
            justify-content: flex-start ; 
            color:rgba(19, 61, 102);
        }
        p{
            padding: 10px;
            font-size: 13px; 
            line-height: 1.5;
        }
        button
        {
            background-color: rgba(17, 60, 94);
            color: aliceblue;
            width: 115px; 
            padding: 5px; 
            margin-left: 10px; 
            border-radius: 7px;
            font-size: 13px;
        }

        @media screen and (max-width:768px) {
                .main
                {
                    width: 100%;
                    height: auto;
                }
                img
            {
                width: 100%;
                height: 200px;
            }
        }        
    

    </style>
</head>
<body>
    <div class="main">
        <div class="subcon1">
            <img  src="./images/lap image.png" alt="">
        </div>
        <div class="subcon2">
            <h1>Web Development</h1>
            <p>Learn HTML, CSS and JavaScript with practical projects and responsive website development.</p>
            <button>Learn More</button>
        </div>
        <div class="subcon3">
            <h1> Responsive Design</h1>
            <p>Create websites that automatically adjust their layout according to desktop, tablet and mobile screens.</p>
            <button>Explore</button>
        </div>
    </div>
</body>
</html>
