<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::after,::before
        {
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
        }
        .main
        {
            background-image: linear-gradient(to right, red,green,blue) ;
            background-clip: padding-box;
            width:100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner
        {
            background-color: whitesmoke;
            width:98%;
            height:95%;
            margin-top: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        nav
        {
            background-color: blue;
            width: 100%;
            height:10vh;
            display: flex;
        
        
        }
        .navbar
        {
            /*background-color: brown;*/
            width: 500px;
            height: 100%;
            font-size: 25px;
            font-weight: 400;
            color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ul
        {
            /*background-color: gray;*/
            width: 900px;
            height: 100%;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
           
         }
         .li
         {
            /*background-color: green;*/
            margin-left: 40px;
            list-style-type: none;
            padding: 5px 15px;
            color: whitesmoke;
            font-size: 20px;
         }
         .link
         {
            /*background-color: yellow;*/
            text-decoration: none;
            position: relative;
            color: whitesmoke;
         }
         span{
            /*background-color: palevioletred;*/
            width:300px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

         }
         
         .SignIn
         {
            background-color: blue;
            padding:10px 10px 10px 10px;
            border-radius: 5px;
            color: whitesmoke;
         }
         .SignUp
         {
            background-color: blue;
            padding:10px 10px 10px 10px;
             border-radius: 5px;
             color: whitesmoke;
         }
         .con1
         {
            background-color: aliceblue;
         }
         h1{
            font-size: 40px;
            font-weight: 900;
            display: flex;
            justify-content: space-around;
            margin: auto;
            margin-top: 150px;
            color: rgba(55, 51, 187) ;
            
           
         }
         h2
         {
            font-size: 25px;
            font-weight: 200;
            margin: auto;
            padding:10px;
           margin-left: 550px;
           color:rgb(41, 47, 54);
         }
    </style>
</head>
<body>
    <div class="main">
        <div class="inner">
        <nav>
            <div class="navbar">NAVBAR</div>
            <ul class="ul">
        <li class="li"><a href="" class="link">Home</a></li>
        <li class="li"><a href="" class="link">About</a></li>
        <li class="li"><a href="" class="link">Blog</a></li>
        <li class="li"><a href="" class="link">Contact</a></li>
    </ul>
    <span class="button1">
        <button class="SignIn">Sign In</button></span>
    <span class="button2">
        <button class="SignUp">Sign Up</button>
    </span>
  
        </nav>
        <div class="con1">
            <h1 style="letter-spacing: 2px; ">NAVIGATION BAR </h1>
            <h2>HTML & CSS ONLY</h2>
        </div>
    </div>
    </div>

</body>
</html>
