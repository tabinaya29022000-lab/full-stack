<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: whitesmoke;
            padding: 25px;
        }

        .invoice {
            background-color: rgb(222, 235, 235);
            max-width: 950px;
            margin: auto;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .company h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .company p {
            font-size: 13px;
            line-height: 1.6;
        }

        .header h1 {
            color: #075078;
            font-size: 36px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 25px;
        }

        .bill,
        .invoice-info {
            width: 50%;
        }

        .blue-title {
            background: #075078;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .bill p {
            font-size: 13px;
            line-height: 1.7;
            padding-left: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .info-box {
            width: 100%;
        }

        .info-box p {
            padding: 5px 12px;
            font-size: 13px;
        }

        /* Input Fields */

        input {
            font-family: Arial;
            border: none;
            outline: none;
            background: transparent;
        }

        .details input {
            width: 100%;
        }

        /* Invoice Table */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #075078;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            border: 1px solid #aaa;
            padding: 7px;
        }

        td input {
            width: 100%;
            font-size: 13px;
        }

        .qty {
            text-align: center;
            width: 55px;
        }

        .price,
        .amount {
            text-align: right;
            width: 120px;
        }

        /* Bottom Section */

        .bottom {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 15px;
        }

        .thankyou {
            font-size: 13px;
            font-weight: bold;
            font-style: italic;
            padding: 10px;
        }

        .summary {
            width: 45%;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            font-size: 14px;
        }

        .summary-row input {
            width: 90px;
            text-align: right;
            font-size: 14px;
        }

        .total {
            background: #075078;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
        }

        /* Responsive */

        @media(max-width: 600px) {

            body {
                padding: 8px;
            }

            .invoice {
                padding: 12px;
            }

            .header {
                gap: 10px;
            }

            .header h1 {
                font-size: 25px;
            }

            .company h2 {
                font-size: 16px;
            }

            .company p {
                font-size: 11px;
            }

            .details {
                gap: 12px;
            }

            .bill,
            .invoice-info {
                width: 50%;
            }

            .blue-title {
                font-size: 10px;
                padding: 6px;
            }

            .bill p,
            .info-box p {
                font-size: 10px;
            }

            table {
                min-width: 550px;
            }

            .bottom {
                flex-direction: column;
            }

            .summary {
                width: 100%;
            }

        }
    </style>
</head>

<body>
    <div class="invoice">

        <!-- Header -->

        <div class="header">
            <div class="company">
                <h2>First Up Consultants</h2>
                <p>
                    12 Beacon St.<br>
                    Boston, MA 98765<br>
                    Phone: (516) 555-0135
                </p>
            </div>
            <h1>INVOICE</h1>
        </div>


        <!-- Customer Details -->

        <div class="details">
            <div class="bill">
                <div class="blue-title">BILL TO</div>
                <p>
                    <input value="Jordan Mitchell"><br>
                    <input value="Khusa Marketing"><br>
                    <input value="123 Main Street"><br>
                    <input value="Seattle, WA 87654"><br>
                    <input value="(954) 555-0190"><br>
                    <input value="jordan@example.com">
                </p>

            </div>


            <div class="invoice-info">
                <div class="info-row">
                    <div class="info-box">
                        <div class="blue-title">INVOICE #</div>
                        <p><input value="2034"></p>
                    </div>
                    <div class="info-box">
                        <div class="blue-title">DATE</div>
                        <p><input value="3/7/25"></p>
                    </div>
                </div>


                <div class="info-row">

                    <div class="info-box">
                        <div class="blue-title">CUSTOMER ID</div>
                        <p><input value="564"></p>
                    </div>
                    <div class="info-box">
                        <div class="blue-title">TERMS</div>
                        <p><input value="Due upon receipt"></p>
                    </div>
                </div>
            </div>
        </div>


        <div class="table-container">
            <table id="invoiceTable">
                <thead>
                    <tr>
                        <th>DESCRIPTION</th>
                        <th class="qty">QTY</th>
                        <th class="price">UNIT PRICE</th>
                        <th class="amount">AMOUNT</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                    <tr>
                        <td>
                            <input class="description" value="Service fee">
                        </td>
                        <td>
                            <input class="qty" type="number" value="1" min="0">
                        </td>
                        <td>
                            <input class="price" type="number" value="200">
                        </td>
                        <td class="amount">$ 200.00</td>
                    </tr>


                    <tr>
                        <td>
                            <input class="description" value="Labor: 5 hours at $75/hr">
                        </td>
                        <td>
                            <input class="qty" type="number" value="5" min="0">
                        </td>
                        <td>
                            <input class="price" type="number" value="75">
                        </td>
                        <td class="amount">$ 375.00</td>
                    </tr>


                    <tr>
                        <td>
                            <input class="description" value="New client discount">
                        </td>
                        <td>
                            <input class="qty" type="number" value="1" min="0">
                        </td>
                        <td>
                            <input class="price" type="number" value="-50">
                        </td>
                        <td class="amount">$ -50.00</td>
                    </tr>
                </tbody>
            </table>
        </div>


        <!-- Bottom Section -->

        <div class="bottom">
            <div class="thankyou">
                Thank you for your business!
            </div>


            <div class="summary">
                <div class="summary-row">
                    <span>SUBTOTAL</span>
                    <span id="subtotal">$ 525.00</span>
                </div>


                <div class="summary-row">
                    <span>TAX RATE</span>
                    <input type="number" id="taxRate" value="4.25" step="0.01" min="0"> %
                </div>


                <div class="summary-row">
                    <span>TAX</span>
                    <span id="tax">$ 22.31</span>
                </div>
                <div class="summary-row total">
                    <span>TOTAL</span>
                    <span id="total">$ 547.31</span>
                </div>
            </div>
        </div>
    </div>



    <script>


        function calculateRow(row) {
            let qty = Number(row.querySelector(".qty").value);
            let price = Number(row.querySelector(".price").value);
            let amount = qty * price;
            row.querySelector(".amount").innerText =
                "$ " + amount.toFixed(2);
            return amount;
        }


        function calculateSubtotal() {
            let rows = document.querySelectorAll("#tableBody tr");
            let subtotal = 0;
            rows.forEach(function (row) {
                subtotal += calculateRow(row);
            });
            return subtotal;

        }
        function calculateTax(subtotal) {
            let taxRate = Number(
                document.getElementById("taxRate").value
            );
            let tax = subtotal * taxRate / 100;
            return tax;
        }



        function calculateInvoice() {
            let subtotal = calculateSubtotal();
            let tax = calculateTax(subtotal);
            let total = subtotal + tax;
            document.getElementById("subtotal").innerText =
                "$ " + subtotal.toFixed(2);
            document.getElementById("tax").innerText =
                "$ " + tax.toFixed(2);
            document.getElementById("total").innerText =
                "$ " + total.toFixed(2);
        }

        document.getElementById("tableBody").addEventListener(
            "input",
            function () {
                calculateInvoice();
            }
        );
        document.getElementById("taxRate").addEventListener(
            "input",
            function () {
                calculateInvoice();
            }
        );
        calculateInvoice();

    </script>
</body>

</html>
