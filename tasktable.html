<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        {
            margin: 0px;
            padding: 0px;
            box-sizing: border_box;
        }
        table
        {
            background-color: aquamarine;
            margin: 40px auto;
            border: 2px solid black;
        }
        table,th,tr,td
        {
            border-collapse: collapse;
        }
        th,tr,td
        {
            font-size: 30px;
            padding: 5px 20px;
            border: 2px solid black;
        }
        tr:hover
        {
            background-color: blue;
        }
        td:hover
        {
            background-color: blueviolet;
        }
        #Gender
        {
            background-color: greenyellow;
        }
        #Age
        {
            background-color: greenyellow;
        }
        #Name
        {
            background-color: yellowgreen;
        }
        #Marks
        {
            background-color: yellowgreen;
        }
    </style>
    </head>
<body>
    <table>
<tr>
    <th id="Name">Name </th>
    <td>Vijay</td>
    <td>Aiswarya</td>
    <td>Vicky</td>
    <td>pavithra</td>
    <td>Suriya</td>
    </tr>
    <tr>
        
            <th id="Age">Age</th>
            <td>30</td>
            <td>24</td>
            <td>32</td>
            <td>21</td>
            <td>33</td>
        </tr>
<tr>
    <th id="Gender"> Gender </th>
    <td>Male</td>
    <td>Female</td>
    <td>male</td>
    <td>Female</td>
    <td>female</td>
</tr>   
<tr>
    <th id="Marks"> Marks</th>
        <td>300</td>
        <td>424</td>
        <td>432</td>
        <td>421</td>
        <td>433</td>
</tr> 
    </table>
</body>
</html>
