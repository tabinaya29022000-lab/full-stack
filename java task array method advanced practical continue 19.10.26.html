        const eligibleEmployees = [...employees].filter(emp => emp.active && emp.performance >= 80);
        const bonusReport = eligibleEmployees.map(emp => {
            let bonusPercentage = emp.performance >= 95 ? 0.15 : 0.10;
            let bonusAmount = emp.salary * bonusPercentage;
            let finalSalary = emp.salary + bonusAmount;
            return {
                id: emp.id,
                name: emp.name,
                department: emp.department,
                salary: emp.salary,
                bonusPercentage: (bonusPercentage * 100) + "%",
                bonusAmount: bonusAmount,
                finalSalary: finalSalary
            };
        });
        bonusReport.sort((a, b) => b.salary - a.salary);
        const tbody = document.getElementById("bonus-tbody");
        let rowsHtml = "";
        bonusReport.forEach(emp => {
            rowsHtml += `
                <tr>
                    <td>${emp.id}</td>
                    <td>${emp.name}</td>
                    <td>${emp.department}</td>
                    <td>₹${emp.salary.toLocaleString()}</td>
                    <td>${emp.bonusPercentage}</td>
                    <td>₹${emp.bonusAmount.toLocaleString()}</td>
                    <td>₹${emp.finalSalary.toLocaleString()}</td>
                </tr>
            `;
        });
        tbody.innerHTML = rowsHtml;
        const totalBonusExpenditure = bonusReport.reduce((sum, emp) => sum + emp.bonusAmount, 0);
        const highestBonusEmployee = bonusReport.reduce((max, emp) => {
            return emp.bonusAmount > max.bonusAmount ? emp : max;
        }, bonusReport[0]);
        document.getElementById("total-bonus").innerText = "₹" + totalBonusExpenditure.toLocaleString();
        document.getElementById("highest-bonus").innerText = `${ highestBonusEmployee.name } (${ highestBonusEmployee.department }) - ₹${ highestBonusEmployee.bonusAmount.toLocaleString() }`;
