<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
        }
        .main
        {
            width: 1000px;
            margin: 20px auto;
            background-color: orange;

        }
        .left
        {
             width: 70%;
            height: 100%;
            background-color: #eee;
            padding: 20px;
            display: flex;

        }
        .sub1
        {
            width: 280px;
            height: 150px;
            background-color: coral;
        }
        .sub2
        {
            width: 280px;
            height: 150px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="left">
            <div class="sub1"></div>
            <div class="sub2"></div>
        </div>
        <div class="right"></div>
    </div>
</body>
</html>
